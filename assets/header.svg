<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Karansinh Desai - Robotics, Autonomy and Applied AI/ML">
  <title>Karansinh Desai — Robotics · Autonomy · Applied AI/ML</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="60%" stop-color="#0D1A2C"/>
      <stop offset="100%" stop-color="#091522"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#76B900"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#17304C" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="240" rx="16"/></clipPath>
    <style>
      .name { font: 600 48px 'Segoe UI', Ubuntu, system-ui, -apple-system, sans-serif; fill: #EDF4FF; letter-spacing: 1px; }
      .role { font: 500 17px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #8FB6D9; letter-spacing: 3.6px; }
      .meta { font: 400 13.5px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #55738F; letter-spacing: 0.8px; }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)" opacity="0.55"/>
    <ellipse cx="250" cy="110" rx="380" ry="180" fill="url(#glow)"/>
    <path d="M0 214 L150 214 L168 196 L186 214 L470 214 L488 202 L506 224 L524 214 L1000 214"
          fill="none" stroke="#1B3A59" stroke-width="1.5" stroke-opacity="0.8"/>
    <g transform="translate(838 120)" opacity="0.92">
      <g fill="none" stroke="#254B70" stroke-width="1.1" opacity="0.75">
        <circle r="30"/><circle r="56"/><circle r="82"/>
      </g>
      <line x1="-82" y1="0" x2="82" y2="0" stroke="#254B70" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="0" y1="-82" x2="0" y2="82" stroke="#254B70" stroke-width="1" stroke-opacity="0.4"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
        <path d="M0 0 L82 -24 A86 86 0 0 1 82 24 Z" fill="url(#sweep)"/>
        <line x1="0" y1="0" x2="82" y2="0" stroke="#4FD8EF" stroke-width="1.4" stroke-opacity="0.7"/>
      </g>
      <circle cx="40" cy="-30" r="2.8" fill="#76B900" opacity="0.85"/>
      <circle cx="-56" cy="20" r="2.6" fill="#4FD8EF" opacity="0.7"/>
      <circle cx="18" cy="62" r="2.4" fill="#4FD8EF" opacity="0.55"/>
      <circle r="3.6" fill="#76B900"/>
    </g>
    <g transform="translate(64 0)">
      <text class="name" x="0" y="112">Karansinh Desai</text>
      <rect x="2" y="132" width="300" height="3" rx="1.5" fill="url(#accent)"/>
      <text class="role" x="2" y="168">ROBOTICS · AUTONOMY · APPLIED AI/ML</text>
      <text class="meta" x="2" y="196">B.Tech Information Technology · BVM Engineering College, Anand</text>
    </g>
    <rect x="0.5" y="0.5" width="999" height="239" rx="16" fill="none" stroke="#1E3E60" stroke-width="1.2"/>
  </g>
</svg>
