<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" role="img" aria-label="Language distribution across public repositories">
  <title>Language distribution — public repositories</title>
  <defs>
    <clipPath id="barclip"><rect x="34" y="74" width="412" height="13" rx="6.5"/></clipPath>
    <style>
      .ttl { font: 600 16px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #EDF4FF; }
      .sub { font: 400 11.5px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #55738F; }
      .lg  { font: 400 13px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #9FC5E8; }
      .pc  { font: 600 13px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #6F90AE; }
    </style>
  </defs>
  <rect x="0.6" y="0.6" width="478.8" height="208.8" rx="12" fill="#0B1220" stroke="#1E3E60" stroke-width="1.2"/>
  <text class="ttl" x="34" y="36">Language Distribution</text>
  <text class="sub" x="34" y="55">across public repositories</text>
  <g clip-path="url(#barclip)">
      <rect x="34.0" y="74" width="237.3" height="13" fill="#3572A5"/>
      <rect x="271.3" y="74" width="70.0" height="13" fill="#F1E05A"/>
      <rect x="341.4" y="74" width="58.5" height="13" fill="#E34C26"/>
      <rect x="399.9" y="74" width="29.7" height="13" fill="#DA5B0B"/>
      <rect x="429.5" y="74" width="4.9" height="13" fill="#89E051"/>
      <rect x="434.5" y="74" width="11.5" height="13" fill="#6E7681"/>
  </g>
    <circle cx="39" cy="112" r="5" fill="#3572A5"/>
    <text class="lg" x="52" y="116">Python</text>
    <text class="pc" x="226" y="116" text-anchor="end">57.6%</text>
    <circle cx="249" cy="112" r="5" fill="#F1E05A"/>
    <text class="lg" x="262" y="116">JavaScript</text>
    <text class="pc" x="436" y="116" text-anchor="end">17.0%</text>
    <circle cx="39" cy="139" r="5" fill="#E34C26"/>
    <text class="lg" x="52" y="143">HTML</text>
    <text class="pc" x="226" y="143" text-anchor="end">14.2%</text>
    <circle cx="249" cy="139" r="5" fill="#DA5B0B"/>
    <text class="lg" x="262" y="143">Jupyter Notebook</text>
    <text class="pc" x="436" y="143" text-anchor="end">7.2%</text>
    <circle cx="39" cy="166" r="5" fill="#89E051"/>
    <text class="lg" x="52" y="170">Shell</text>
    <text class="pc" x="226" y="170" text-anchor="end">1.2%</text>
    <circle cx="249" cy="166" r="5" fill="#6E7681"/>
    <text class="lg" x="262" y="170">Other</text>
    <text class="pc" x="436" y="170" text-anchor="end">2.8%</text>
</svg>