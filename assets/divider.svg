<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#0A66C2" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="82%"  stop-color="#76B900" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#76B900" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#CFFAFE" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#22D3EE" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="5" width="1000" height="2" rx="1" fill="url(#base)"/>
  <ellipse cx="0" cy="6" rx="70" ry="6" fill="url(#pulse)">
    <animate attributeName="cx" values="-70;1070" dur="4.6s" repeatCount="indefinite"/>
  </ellipse>
  <circle cy="6" r="2.6" fill="#EAFDFF">
    <animate attributeName="cx" values="-70;1070" dur="4.6s" repeatCount="indefinite"/>
  </circle>
</svg>
